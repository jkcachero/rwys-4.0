openapi: 3.1.0
info:
    title: RWYS Agent API
    version: 1.0.0
    description: Curated client-scoped Zernio capabilities and an account-scoped read-only AdKit provider broker. Callers supply only the RWYS Sanctum Bearer API_KEY; provider credentials and project context are internal. AdKit preserves raw provider identifiers and payloads, unlike Zernio local UUID resources. Response middleware adds request_id to success and error JSON envelopes.
servers:
    - url: /api/v1
security:
    - bearerAuth: []
paths:
    /context:
        get:
            operationId: getAgentContext
            x-agent-ability: context.read
            responses:
                '200':
                    description: Authenticated Client context.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ContextResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '429': { $ref: '#/components/responses/RateLimited' }
    /capabilities:
        get:
            operationId: listAgentCapabilities
            x-agent-ability: context.read
            responses:
                '200':
                    description: Implemented capabilities granted to the current token.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CapabilitiesResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
    /manage/platform-api-requests:
        post:
            operationId: forwardAdKitRequest
            x-agent-ability: adkit.read
            description: >-
                Forwards the documented AdKit provider request using only Authorization Bearer API_KEY
                (the RWYS Sanctum token). Provider credentials and project context are injected internally;
                no caller-supplied provider key or project header is required. Caller project headers are
                ignored and never forwarded; provider credential fields in the body are rejected. The upstream host
                is fixed and not caller-controlled. Only GET reads of an authorized act_target account root,
                campaigns, adsets, ads or insights are allowed, not generic writes or an arbitrary-path proxy. accountId
                is the stored act_context, not the endpoint target; when omitted it is injected internally,
                and when supplied it must match the stored context. Provider IDs and metrics are preserved
                without local campaign UUID mappings or normalized rows. Source provenance: direct-provider curl
                against AdKit Meta ads on 2026-10-26 returned populated account stats, including spend 180.28.
                This verifies the upstream contract, not live RWYS forwarding: the current forwarding route has
                automated fake-backed coverage; live acceptance requires configured Client mappings, enabled dispatch
                and an available authorized RWYS key. The example requests
                ad-level insights for August 26 through October 26. Pagination remains provider-owned.
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/AdKitForwardRequest' }
                        example:
                            platform: meta
                            endpoint: act_1185818863112933/insights
                            method: GET
                            description: Read Meta ad stats from August 26 through October 26
                            payload:
                                fields: account_id,campaign_id,campaign_name,adset_id,adset_name,ad_id,ad_name,impressions,reach,clicks,spend,cpc,cpm,ctr,date_start,date_stop
                                time_range: '{"since":"2026-08-26","until":"2026-10-26"}'
                                level: ad
                                limit: 25
            responses:
                '200':
                    description: Provider forwarding envelope with raw provider response and results; middleware adds request_id. Empty results do not imply zero activity.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/AdKitForwardResponse' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
                '502': { $ref: '#/components/responses/AdKitProviderError' }
                '503': { $ref: '#/components/responses/AdKitProviderUnavailable' }
    /zernio/accounts:
        get:
            operationId: listZernioAccounts
            x-agent-ability: zernio.accounts.read
            parameters:
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Authorized local Zernio account mappings.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountListResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
    /zernio/accounts/{account}/status:
        get:
            operationId: getZernioAccountStatus
            x-agent-ability: zernio.accounts.read
            parameters:
                - $ref: '#/components/parameters/AccountId'
            responses:
                '200':
                    description: Provider-verified account status.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountStatusResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
                '502': { $ref: '#/components/responses/ProviderError' }
                '503': { $ref: '#/components/responses/ProviderUnavailable' }
    /zernio/accounts/{account}/posts:
        get:
            operationId: listZernioPosts
            x-agent-ability: zernio.posts.read
            parameters:
                - $ref: '#/components/parameters/AccountId'
                - $ref: '#/components/parameters/Limit'
                - $ref: '#/components/parameters/ProviderCursor'
            responses:
                '200':
                    description: Provider-verified posts represented by local IDs.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PostListResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
                '502': { $ref: '#/components/responses/ProviderError' }
                '503': { $ref: '#/components/responses/ProviderUnavailable' }
        post:
            operationId: publishZernioPost
            x-agent-ability: zernio.posts.publish
            parameters:
                - $ref: '#/components/parameters/AccountId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            { $ref: '#/components/schemas/PublishPostRequest' }
            responses:
                '202':
                    description: Durable immediate-publication operation.
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: '#/components/schemas/OperationResponse',
                                }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
                '502': { $ref: '#/components/responses/ProviderError' }
                '503': { $ref: '#/components/responses/ProviderUnavailable' }
    /zernio/accounts/{account}/scheduled-posts:
        post:
            operationId: scheduleZernioPost
            x-agent-ability: zernio.posts.schedule
            parameters:
                - $ref: '#/components/parameters/AccountId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            { $ref: '#/components/schemas/SchedulePostRequest' }
            responses:
                '202':
                    description: Durable scheduled-publication operation.
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: '#/components/schemas/OperationResponse',
                                }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
                '502': { $ref: '#/components/responses/ProviderError' }
                '503': { $ref: '#/components/responses/ProviderUnavailable' }
    /zernio/accounts/{account}/posts/{post}:
        get:
            operationId: getZernioPost
            x-agent-ability: zernio.posts.read
            parameters:
                - $ref: '#/components/parameters/AccountId'
                - $ref: '#/components/parameters/PostId'
            responses:
                '200':
                    description: Provider-verified post represented by a local ID.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PostResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
                '502': { $ref: '#/components/responses/ProviderError' }
                '503': { $ref: '#/components/responses/ProviderUnavailable' }
    /zernio/accounts/{account}/posts/{post}/analytics:
        get:
            operationId: getZernioPostAnalytics
            x-agent-ability: zernio.analytics.read
            parameters:
                - $ref: '#/components/parameters/AccountId'
                - $ref: '#/components/parameters/PostId'
            responses:
                '200':
                    description: Available analytics without collapsing zero, null, or absent values.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AnalyticsResponse'
                '202':
                    description: Analytics synchronization is pending.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AnalyticsResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
                '502': { $ref: '#/components/responses/ProviderError' }
                '503': { $ref: '#/components/responses/ProviderUnavailable' }
    /operations:
        get:
            operationId: listAgentOperations
            x-agent-ability: operations.read
            parameters:
                - $ref: '#/components/parameters/Limit'
                - $ref: '#/components/parameters/OperationCursor'
            responses:
                '200':
                    description: Bounded Client-scoped operation history without provider polling.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OperationListResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
    /operations/{operation}:
        get:
            operationId: getAgentOperation
            x-agent-ability: operations.read
            parameters:
                - $ref: '#/components/parameters/OperationId'
            responses:
                '200':
                    description: One Client-scoped operation.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OperationResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/Unprocessable' }
                '429': { $ref: '#/components/responses/RateLimited' }
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: RWYS token
    parameters:
        AccountId:
            name: account
            in: path
            required: true
            description: RWYS-local account UUID.
            schema: { type: string, format: uuid }
        PostId:
            name: post
            in: path
            required: true
            description: RWYS-local post UUID.
            schema: { type: string, format: uuid }
        OperationId:
            name: operation
            in: path
            required: true
            description: RWYS-local operation UUID.
            schema: { type: string, format: uuid }
        Limit:
            name: limit
            in: query
            required: false
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        ProviderCursor:
            name: cursor
            in: query
            required: false
            schema: { type: string, minLength: 1, maxLength: 512 }
        OperationCursor:
            name: cursor
            in: query
            required: false
            schema: { type: string, format: uuid }
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: true
            schema: { type: string, minLength: 8, maxLength: 200 }
    responses:
        AdKitProviderError:
            description: AdKit authentication failure, invalid or oversized response, invalid read request, or provider error (502). Flat error/message envelope with middleware request_id.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/AdKitErrorResponse' }
        AdKitProviderUnavailable:
            description: AdKit disabled, unavailable configuration or credentials, invalid mapping, unreachable provider, or provider rate limit (503). Flat error/message envelope with middleware request_id.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/AdKitErrorResponse' }
        Unauthorized:
            description: Bearer authentication is missing or invalid.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        Forbidden:
            description: Current Client, principal, token, origin, ability, or account authorization failed.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        NotFound:
            description: The local Client-scoped resource was not found.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        Unprocessable:
            description: Input validation failed or an unknown field was supplied.
            content:
                application/json:
                    schema:
                        { $ref: '#/components/schemas/ValidationErrorResponse' }
        RateLimited:
            description: Aggregate request or in-flight admission limit reached.
            headers:
                Retry-After:
                    schema: { type: integer, minimum: 1 }
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        Conflict:
            description: The idempotency key was already used for a different normalized payload.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        ProviderError:
            description: The fixed upstream provider returned an invalid or unsuccessful response.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        ProviderUnavailable:
            description: The fixed upstream provider or approved credentials are unavailable.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
    schemas:
        RequestId:
            type: string
            format: uuid
        Ability:
            type: string
            enum:
                - context.read
                - zernio.accounts.read
                - zernio.posts.read
                - zernio.analytics.read
                - operations.read
                - adkit.read
                - zernio.posts.publish
        AdKitForwardRequest:
            type: object
            additionalProperties: false
            required: [platform, endpoint, method, description, payload]
            properties:
                platform: { type: string, const: meta }
                accountId:
                    type: string
                    maxLength: 100
                    pattern: '^act_[0-9]+$'
                    description: Optional act_context injected internally if omitted. If supplied, must match the stored provider account context; this is not an RWYS UUID or the act_target endpoint selector.
                endpoint:
                    type: string
                    maxLength: 100
                    pattern: '^/?act_[0-9]+(?:/(?:campaigns|insights|adsets|ads))?$'
                    description: Authorized act_target root, campaigns, adsets, ads or insights only. An optional leading slash is accepted. No URL, host, query string, arbitrary path or campaign-ID path. Target authorization is enforced by RWYS.
                method: { type: string, const: GET }
                description: { type: string, minLength: 1, maxLength: 200 }
                payload: { $ref: '#/components/schemas/AdKitReadPayload' }
        AdKitReadPayload:
            type: object
            additionalProperties: false
            description: Only whitelisted read parameters are accepted. fields is a comma-separated list of distinct approved scalar provider fields appropriate to the endpoint, not a Graph expansion or arbitrary query. RWYS may add upstream identity fields for authorization and removes only those additions before returning the provider projection. Insights require exactly one of time_range or date_preset; other reads cannot supply time_range, date_preset or level. No credentials, headers, project, host or mutation fields are accepted.
            required: [fields]
            properties:
                fields:
                    type: string
                    maxLength: 1000
                    pattern: '^(?:id|account_id|account_currency|name|account_status|disable_reason|currency|timezone_name|status|effective_status|objective|daily_budget|lifetime_budget|created_time|updated_time|campaign_id|campaign_name|adset_id|adset_name|ad_id|ad_name|impressions|reach|clicks|spend|cpc|cpm|ctr|date_start|date_stop)(?:,(?:id|account_id|account_currency|name|account_status|disable_reason|currency|timezone_name|status|effective_status|objective|daily_budget|lifetime_budget|created_time|updated_time|campaign_id|campaign_name|adset_id|adset_name|ad_id|ad_name|impressions|reach|clicks|spend|cpc|cpm|ctr|date_start|date_stop))*$'
                limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
                after:
                    type: string
                    minLength: 1
                    maxLength: 4096
                    description: Opaque provider continuation cursor, not a URL. Reuse only with the same authorized endpoint and filters.
                time_range:
                    type: string
                    maxLength: 100
                    contentMediaType: application/json
                    description: JSON-encoded object with since and until ISO dates, not a nested JSON request object. since <= until <= today, at most 90 days inclusive. Mutually exclusive with date_preset.
                    contentSchema:
                        type: object
                        additionalProperties: false
                        required: [since, until]
                        properties:
                            since: { type: string, format: date }
                            until: { type: string, format: date }
                    example: '{"since":"2026-08-26","until":"2026-10-26"}'
                date_preset:
                    type: string
                    enum: [today, yesterday, this_month, last_month, this_quarter, maximum, last_3d, last_7d, last_14d, last_28d, last_30d, last_90d, last_week_mon_sun, last_week_sun_sat, last_quarter, last_year, this_week_mon_today, this_week_sun_today, this_year]
                    description: Provider date preset, including maximum. Mutually exclusive with time_range.
                level: { type: string, enum: [account, campaign, adset, ad] }
            not:
                required: [time_range, date_preset]
        AdKitForwardResponse:
            type: object
            additionalProperties: false
            description: Preserves the provider forwarding envelope. response is the raw provider object and results is the raw provider array, including provider IDs, string metrics and provider pagination when present. No fabricated zero metrics, normalized rows or campaign UUID mappings. Nested provider objects remain extensible according to the provider contract.
            required: [platform, status, response, results, request_id]
            properties:
                platform: { type: string, const: meta }
                status: { type: string, const: executed }
                response: { type: object, additionalProperties: true }
                results:
                    type: array
                    items: { type: object, additionalProperties: true }
                request_id: { $ref: '#/components/schemas/RequestId' }
        AdKitErrorResponse:
            type: object
            additionalProperties: false
            required: [error, message, request_id]
            properties:
                error:
                    type: string
                    enum:
                        - adkit_disabled
                        - adkit_configuration_error
                        - adkit_connection_invalid
                        - adkit_mapping_invalid
                        - adkit_unreachable
                        - adkit_rate_limited
                        - adkit_authentication_failed
                        - adkit_invalid_response
                        - adkit_response_too_large
                        - adkit_invalid_request
                        - adkit_provider_error
                message: { type: string }
                request_id: { $ref: '#/components/schemas/RequestId' }
        PublishPostRequest:
            type: object
            additionalProperties: false
            required: [content]
            properties:
                content: { type: string, minLength: 1, maxLength: 3000 }
                images:
                    type: array
                    minItems: 1
                    maxItems: 2
                    description: One JPEG publishes an Instagram image post; two ordered JPEGs publish an Instagram carousel. Not accepted for other platforms.
                    items:
                        type: string
                        format: binary
        SchedulePostRequest:
            type: object
            additionalProperties: false
            required: [content, scheduled_for, image]
            properties:
                content: { type: string, minLength: 1, maxLength: 2200 }
                scheduled_for:
                    type: string
                    format: date-time
                    description: UTC timestamp accepted only within the server-owned scheduling window.
                image:
                    type: string
                    format: binary
                    description: JPEG image subject to the documented size, dimension, pixel, and aspect-ratio limits.
        ContextResponse:
            type: object
            additionalProperties: false
            required: [client, capabilities, request_id]
            properties:
                client:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                capabilities:
                    type: array
                    uniqueItems: true
                    items: { $ref: '#/components/schemas/Ability' }
                request_id: { $ref: '#/components/schemas/RequestId' }
        CapabilitiesResponse:
            type: object
            additionalProperties: false
            required: [capabilities, request_id]
            properties:
                capabilities:
                    type: array
                    uniqueItems: true
                    items: { $ref: '#/components/schemas/Ability' }
                request_id: { $ref: '#/components/schemas/RequestId' }
        Account:
            type: object
            additionalProperties: false
            required: [id, platform, name]
            properties:
                id: { type: string, format: uuid }
                platform: { type: string }
                name: { type: string }
        AccountListResponse:
            type: object
            additionalProperties: false
            required: [data, meta, request_id]
            properties:
                data:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
                meta:
                    type: object
                    additionalProperties: false
                    required: [limit, has_more]
                    properties:
                        limit: { type: integer, minimum: 1, maximum: 100 }
                        has_more: { type: boolean }
                request_id: { $ref: '#/components/schemas/RequestId' }
        AccountStatus:
            type: object
            additionalProperties: false
            required:
                [
                    id,
                    platform,
                    name,
                    active,
                    status,
                    requires_reconnect,
                    rate_limited,
                    client_id,
                    restricted,
                ]
            properties:
                id: { type: string, format: uuid }
                platform: { type: string }
                name: { type: string }
                active: { type: boolean }
                status: { type: [string, 'null'] }
                requires_reconnect: { type: boolean }
                rate_limited: { type: boolean }
                client_id: { type: string, format: uuid }
                restricted: { type: boolean }
        AccountStatusResponse:
            type: object
            additionalProperties: false
            required: [data, request_id]
            properties:
                data: { $ref: '#/components/schemas/AccountStatus' }
                request_id: { $ref: '#/components/schemas/RequestId' }
        Post:
            type: object
            additionalProperties: false
            required: [id, account_id, status, scheduled_at, published_at]
            properties:
                id: { type: string, format: uuid }
                account_id: { type: string, format: uuid }
                status: { type: [string, 'null'] }
                scheduled_at: { type: [string, 'null'], format: date-time }
                published_at: { type: [string, 'null'], format: date-time }
        PostListResponse:
            type: object
            additionalProperties: false
            required: [data, meta, request_id]
            properties:
                data:
                    type: array
                    items: { $ref: '#/components/schemas/Post' }
                meta:
                    type: object
                    additionalProperties: false
                    required: [limit, next_cursor]
                    properties:
                        limit: { type: integer, minimum: 1, maximum: 100 }
                        next_cursor: { type: [string, 'null'] }
                request_id: { $ref: '#/components/schemas/RequestId' }
        PostResponse:
            type: object
            additionalProperties: false
            required: [data, request_id]
            properties:
                data: { $ref: '#/components/schemas/Post' }
                request_id: { $ref: '#/components/schemas/RequestId' }
        AnalyticsResponse:
            type: object
            additionalProperties: false
            required: [data, request_id]
            properties:
                data:
                    type: object
                    additionalProperties: false
                    required: [post_id, state, metrics]
                    properties:
                        post_id: { type: string, format: uuid }
                        state:
                            {
                                type: string,
                                enum: [synced, pending, partial, unavailable],
                            }
                        reason: { type: string }
                        message: { type: [string, 'null'] }
                        metrics:
                            type: object
                            additionalProperties: true
                        platforms:
                            type: array
                            items:
                                type: object
                                additionalProperties: true
                request_id: { $ref: '#/components/schemas/RequestId' }
        Operation:
            type: object
            additionalProperties: false
            required:
                [
                    id,
                    capability,
                    status,
                    account_id,
                    outcome,
                    requested_at,
                    started_at,
                    completed_at,
                ]
            properties:
                id: { type: string, format: uuid }
                capability: { type: string }
                status: { type: string }
                account_id: { type: [string, 'null'], format: uuid }
                outcome: { type: [object, 'null'], additionalProperties: true }
                requested_at: { type: string, format: date-time }
                started_at: { type: [string, 'null'], format: date-time }
                completed_at: { type: [string, 'null'], format: date-time }
        OperationListResponse:
            type: object
            additionalProperties: false
            required: [data, meta, request_id]
            properties:
                data:
                    type: array
                    items: { $ref: '#/components/schemas/Operation' }
                meta:
                    type: object
                    additionalProperties: false
                    required: [limit, next_cursor]
                    properties:
                        limit: { type: integer, minimum: 1, maximum: 100 }
                        next_cursor: { type: [string, 'null'], format: uuid }
                request_id: { $ref: '#/components/schemas/RequestId' }
        OperationResponse:
            type: object
            additionalProperties: false
            required: [data, request_id]
            properties:
                data: { $ref: '#/components/schemas/Operation' }
                request_id: { $ref: '#/components/schemas/RequestId' }
        ErrorResponse:
            type: object
            additionalProperties: false
            required: [request_id]
            properties:
                message: { type: string }
                error:
                    type: object
                    additionalProperties: false
                    required: [code, message]
                    properties:
                        code: { type: string }
                        message: { type: string }
                request_id: { $ref: '#/components/schemas/RequestId' }
            anyOf:
                - required: [message]
                - required: [error]
        ValidationErrorResponse:
            type: object
            additionalProperties: false
            required: [message, errors, request_id]
            properties:
                message: { type: string }
                errors:
                    type: object
                    additionalProperties:
                        type: array
                        items: { type: string }
                request_id: { $ref: '#/components/schemas/RequestId' }
